name: Börslarm

on:
  workflow_dispatch:

  schedule:
    - cron: '*/12 * * * 1-5'

    # 10:30 11.30 12.30 svensk tid (ungefär)
    #- cron: '30 8 * * 1-5'
    #- cron: '30 9 * * 1-5'
    #- cron: '30 10 * * 1-5'

jobs:
  alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run alert
        run: python alert1.py
        env:
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
